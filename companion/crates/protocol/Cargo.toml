[package]
name = "duhcord-private-protocol"
version = "0.1.0"
edition.workspace = true

[dependencies]
chacha20poly1305 = "=0.10.1"
flate2 = { version = "=1.1.5", default-features = false, features = ["rust_backend"] }
getrandom = "=0.3.4"
hkdf = "=0.12.4"
hpke = { version = "=0.13.0", default-features = false, features = ["alloc", "std", "x25519"] }
rand_core = { version = "=0.9.3", features = ["os_rng"] }
sha2 = "=0.10.9"
thiserror = "=2.0.17"
x25519-dalek = { version = "=2.0.1", features = ["static_secrets", "zeroize"] }
zeroize = "=1.8.2"
