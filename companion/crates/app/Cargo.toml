[package]
name = "duhcord-companion"
version = "0.2.1"
edition.workspace = true
description = "Duhcord Private Companion: keeps your Duhcord Private key and plaintext outside Discord."
publish = false

[[bin]]
name = "duhcord-companion"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
duhcord-companion-bridge = { path = "../bridge" }
duhcord-companion-service = { path = "../service" }
duhcord-companion-store = { path = "../store" }
directories = "=6.0.0"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
tauri = { version = "=2.12.5", features = ["tray-icon"] }
tauri-plugin-autostart = "=2.7.0"
tauri-plugin-single-instance = "=2.5.5"
tokio = { version = "=1.48.0", features = ["sync"] }
