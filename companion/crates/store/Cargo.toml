[package]
name = "duhcord-companion-store"
version = "0.1.0"
edition.workspace = true

[dependencies]
duhcord-companion-engine = { path = "../engine" }
base64 = "=0.22.1"
chacha20poly1305 = "=0.10.1"
directories = "=6.0.0"
getrandom = "=0.3.4"
keyring = { version = "=3.6.3", default-features = false, features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
thiserror = "=2.0.17"
zeroize = "=1.8.2"
