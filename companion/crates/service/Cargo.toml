[package]
name = "duhcord-companion-service"
version = "0.1.0"
edition.workspace = true
description = "Headless core of the Duhcord Private Companion: routes bridge traffic through the engine and store."

[dependencies]
duhcord-companion-bridge = { path = "../bridge" }
duhcord-companion-engine = { path = "../engine" }
duhcord-companion-store = { path = "../store" }
duhcord-private-protocol = { path = "../protocol" }
base64 = "=0.22.1"
getrandom = "=0.3.4"
hex = "=0.4.3"
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls"] }
serde = { version = "=1.0.228", features = ["derive"] }
thiserror = "=2.0.17"
tokio = { version = "=1.48.0", features = ["macros", "rt-multi-thread", "sync", "time"] }
url = "=2.5.7"
zeroize = "=1.8.2"

[dev-dependencies]
futures-util = "=0.3.31"
keyring = { version = "=3.6.3", default-features = false }
serde_json = "=1.0.145"
tokio-tungstenite = "=0.26.2"
