[package]
name = "duhcord-companion-bridge"
version = "0.1.0"
edition.workspace = true

[dependencies]
duhcord-companion-engine = { path = "../engine" }
duhcord-companion-store = { path = "../store" }
duhcord-private-protocol = { path = "../protocol" }
base64 = "=0.22.1"
futures-util = "=0.3.31"
getrandom = "=0.3.4"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
thiserror = "=2.0.17"
time = { version = "=0.3.44", features = ["parsing"] }
tokio = { version = "=1.48.0", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = "=0.26.2"
