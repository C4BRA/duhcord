name: Companion release

# Push a tag like companion-v0.1.0 (or run by hand) to build the Duhcord Private Companion for every platform and the
# three plugins, then draft a v0.1.0 release in C4BRA/duhcord-private-plugin with one-click zips and SHA-256 checksums.
#
# Kept apart from Duhcord's release (release.yml, v* tags): different tags, a different release repository (so
# Duhcord's "latest release", which its updater reads, is never a companion release), no Duhcord secrets, and its own
# `companion-release` environment holding COMPANION_RELEASE_TOKEN (Contents: write on duhcord-private-plugin only).

on:
  push:
    tags: ["companion-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Companion tag to build (e.g. companion-v0.1.0)
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || github.ref_name }}
  RELEASE_REPO: C4BRA/duhcord-private-plugin

defaults:
  run:
    working-directory: companion

jobs:
  check:
    name: Check the tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
    defaults:
      run:
        working-directory: .
    steps:
      - id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^companion-v([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?)$ ]] || {
            echo "error: companion tags must look like companion-v0.1.0" >&2; exit 1; }
          version="${BASH_REMATCH[1]}"
          # Only commits already on the default branch can be released, as for Duhcord.
          status="$(gh api "repos/$GITHUB_REPOSITORY/compare/$DEFAULT_BRANCH...$GITHUB_SHA" --jq .status)"
          [[ "$status" == "identical" || "$status" == "behind" ]] || {
            echo "error: $TAG points at a commit that isn't on $DEFAULT_BRANCH ($status)" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

  plugins:
    name: Plugins
    needs: check
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - name: Set the version
        run: npm version --no-git-tag-version --allow-same-version "$VERSION"
      - run: npm run typecheck
      - run: npm run build
      - name: Zip each plugin
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/out"
          mkdir -p "$out"
          (cd plugins/dist/betterdiscord && zip -9 "$out/DuhcordPrivate-BetterDiscord-$VERSION.zip" DuhcordPrivate.plugin.js)
          (cd plugins/dist/replugged && zip -9 "$out/DuhcordPrivate-Replugged-$VERSION.zip" dev.c4bra.DuhcordPrivate.asar)
          (cd plugins/dist/vencord && zip -9r "$out/DuhcordPrivate-Vencord-$VERSION.zip" duhcordPrivate)
          # Replugged's "install from GitHub" link wants the bare asar and manifest as release assets.
          cp plugins/dist/replugged/dev.c4bra.DuhcordPrivate.asar plugins/dist/replugged/dev.c4bra.DuhcordPrivate.json "$out/"
          cp plugins/dist/betterdiscord/DuhcordPrivate.plugin.js "$out/"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: companion-release-plugins
          path: out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: companion-bundled-plugins
          path: companion/crates/app/resources/plugins

  app:
    name: Companion (${{ matrix.name }})
    needs: [check, plugins]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS-AppleSilicon
            os: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
          - name: macOS-Intel
            os: macos-latest
            target: x86_64-apple-darwin
            bundles: app,dmg
          - name: Windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
          - name: Linux-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb,rpm
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf file
      - name: Toolchain (from rust-toolchain.toml) and target
        shell: bash
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add ${{ matrix.target }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: companion-bundled-plugins
          path: companion/crates/app/resources/plugins
      - run: npm ci --ignore-scripts
      - name: Set the version
        shell: bash
        run: |
          node -e '
            const fs = require("fs"), v = process.argv[1], f = "crates/app/tauri.conf.json";
            const c = JSON.parse(fs.readFileSync(f, "utf8")); c.version = v;
            fs.writeFileSync(f, JSON.stringify(c, null, 2) + "\n");' "$VERSION"
      # No caches here: release builds start clean.
      - name: Build
        shell: bash
        run: npx tauri build --config crates/app/tauri.conf.json --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} -- --locked
      - name: Package one-click zip
        shell: bash
        run: |
          set -euo pipefail
          B="target/${{ matrix.target }}/release/bundle"
          out="$GITHUB_WORKSPACE/out"
          mkdir -p "$out"
          ZIP="$out/DuhcordCompanion-${{ matrix.name }}-$VERSION.zip"
          case "${{ runner.os }}" in
            macOS)
              ditto -c -k --keepParent "$B/macos/Duhcord Companion.app" "$ZIP"
              cp "$B"/dmg/*.dmg "$out/DuhcordCompanion-${{ matrix.name }}-$VERSION.dmg"
              ;;
            Windows)
              cp "$(ls "$B"/nsis/*-setup.exe)" "$out/DuhcordCompanion-Setup-$VERSION.exe"
              cp "$B"/msi/*.msi "$out/DuhcordCompanion-$VERSION.msi"
              (cd "$out" && 7z a -tzip "$(basename "$ZIP")" "DuhcordCompanion-Setup-$VERSION.exe")
              ;;
            Linux)
              cp "$B"/appimage/*.AppImage "$out/DuhcordCompanion-$VERSION-x86_64.AppImage"
              chmod +x "$out/DuhcordCompanion-$VERSION-x86_64.AppImage"
              cp "$B"/deb/*.deb "$B"/rpm/*.rpm "$out/"
              (cd "$out" && zip -9 "$(basename "$ZIP")" "DuhcordCompanion-$VERSION-x86_64.AppImage")
              ;;
          esac
          ls -la "$out"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: companion-release-${{ matrix.name }}
          path: out

  publish:
    name: Draft the release in duhcord-private-plugin
    needs: [check, plugins, app]
    runs-on: ubuntu-latest
    # Its own environment and token. Never Duhcord's `release` environment.
    environment: companion-release
    defaults:
      run:
        working-directory: .
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: companion/release-notes.md
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: companion-release-*
          path: out
          merge-multiple: true
      - name: Checksums
        run: cd out && sha256sum * | tee SHA256SUMS.txt
      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ secrets.COMPANION_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          [ -n "$GH_TOKEN" ] || { echo "error: COMPANION_RELEASE_TOKEN isn't set in the companion-release environment" >&2; exit 1; }
          tag="v$VERSION"
          if gh release view "$tag" --repo "$RELEASE_REPO" >/dev/null 2>&1; then
            gh release upload "$tag" out/* --repo "$RELEASE_REPO" --clobber
          else
            gh release create "$tag" out/* --repo "$RELEASE_REPO" --draft \
              --title "Duhcord Companion $VERSION" --notes-file companion/release-notes.md
          fi
