name: Release

# Push a tag like v1.2.0 to publish a release that the in-app updater will offer.
# The tag's annotation message becomes the release notes shown in the update prompt.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    env:
      TAG: ${{ github.ref_name }}
    outputs:
      version: ${{ steps.tag.outputs.version }}
      sha256: ${{ steps.package.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-tags: true
      - name: Check the tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "error: tags must look like v1.2.3" >&2; exit 1; }
          # Only commits already on the default branch can be released, so a tag on a side branch can't ship.
          status="$(gh api "repos/$GITHUB_REPOSITORY/compare/$DEFAULT_BRANCH...$GITHUB_SHA" --jq .status)"
          [[ "$status" == "identical" || "$status" == "behind" ]] || {
            echo "error: $TAG points at a commit that isn't on $DEFAULT_BRANCH ($status)" >&2; exit 1; }
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      # libdave and its dependencies for the voice helper, rebuilt only when the pinned versions change.
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: Vendor/libdave
          key: libdave-${{ runner.os }}-${{ hashFiles('scripts/build-libdave.sh', 'Sources/CDave/include/dave.h') }}
      - name: Build libdave
        run: scripts/build-libdave.sh
      - name: Test
        run: swift test
      - name: Build and verify unsigned app
        env:
          DUHCORD_BUILD: ${{ github.run_number }}
        run: |
          DUHCORD_VERSION="$VERSION" scripts/bundle.sh
          scripts/verify-bundle.sh build/Duhcord.app
          ditto -c -k --keepParent build/Duhcord.app build/Duhcord-unsigned.zip
      - name: Hash unsigned app
        id: package
        run: echo "sha256=$(shasum -a 256 build/Duhcord-unsigned.zip | awk '{print $1}')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Duhcord-unsigned
          path: build/Duhcord-unsigned.zip
          archive: false

  publish:
    runs-on: macos-15
    needs: build
    environment: release
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-tags: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Duhcord-unsigned
          path: build
      - name: Check unsigned app hash
        run: echo "${{ needs.build.outputs.sha256 }}  build/Duhcord-unsigned.zip" | shasum -a 256 -c -
      - name: Unpack unsigned app
        run: ditto -x -k build/Duhcord-unsigned.zip build/
      - name: Import signing certificate
        env:
          DUHCORD_SIGNING_P12: ${{ secrets.DUHCORD_SIGNING_P12 }}
          DUHCORD_SIGNING_PASSWORD: ${{ secrets.DUHCORD_SIGNING_PASSWORD }}
        run: scripts/ci-import-certificate.sh
      - name: Sign and verify app
        run: |
          scripts/sign-bundle.sh build/Duhcord.app
          DUHCORD_REQUIRE_RELEASE_SIGNATURE=1 scripts/verify-bundle.sh build/Duhcord.app
          ditto -c -k --keepParent build/Duhcord.app build/Duhcord.zip
      - name: Remove signing keychain
        if: always() && env.DUHCORD_SIGN_KEYCHAIN != ''
        run: security delete-keychain "$DUHCORD_SIGN_KEYCHAIN"
      - name: Write and sign the update manifest
        env:
          DUHCORD_UPDATE_KEY: ${{ secrets.DUHCORD_UPDATE_KEY }}
        run: |
          notes="$(git tag -l --format='%(contents)' "$TAG")"
          [ -n "$notes" ] || notes="$(git log -1 --format=%B)"
          printf '%s\n' "$notes" > build/notes.txt
          scripts/make-update-manifest.sh "$VERSION" build/Duhcord.zip build/notes.txt > build/update.json
          public_key="$(swift scripts/sign-update.swift build/update.json)"
          # Refuse to publish an update that no installed copy of Duhcord would accept.
          grep -qF "\"$public_key\"" Sources/DuhcordUpdateKit/UpdateKit.swift || {
            echo "error: the update key's public half ($public_key) isn't in UpdateKit.trustedPublicKeys" >&2
            exit 1
          }
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" build/Duhcord.zip build/update.json build/update.json.sig \
            --repo "$GITHUB_REPOSITORY" --title "Duhcord $VERSION" --notes-file build/notes.txt
