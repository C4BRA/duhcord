name: Release

# Push a tag like v0.1.0 (or run by hand) to build the companion for every platform and the three
# plugins, then publish a draft GitHub release with one-click zips and SHA-256 checksums.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create or update (e.g. v0.1.0)
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  plugins:
    name: Plugins
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Zip each plugin
        run: |
          mkdir -p out
          V="${TAG#v}"
          (cd plugins/dist/betterdiscord && zip -9 "$GITHUB_WORKSPACE/out/DuhcordPrivate-BetterDiscord-$V.zip" DuhcordPrivate.plugin.js)
          (cd plugins/dist/replugged && zip -9 "$GITHUB_WORKSPACE/out/DuhcordPrivate-Replugged-$V.zip" dev.c4bra.DuhcordPrivate.asar)
          (cd plugins/dist/vencord && zip -9r "$GITHUB_WORKSPACE/out/DuhcordPrivate-Vencord-$V.zip" duhcordPrivate)
          # Replugged's "install from GitHub" link wants the bare asar and manifest as release assets.
          cp plugins/dist/replugged/dev.c4bra.DuhcordPrivate.asar plugins/dist/replugged/dev.c4bra.DuhcordPrivate.json out/
          cp plugins/dist/betterdiscord/DuhcordPrivate.plugin.js out/
      - uses: actions/upload-artifact@v4
        with:
          name: release-plugins
          path: out
      - uses: actions/upload-artifact@v4
        with:
          name: bundled-plugins
          path: crates/app/resources/plugins

  app:
    name: Companion (${{ matrix.name }})
    needs: plugins
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS-AppleSilicon
            os: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
          - name: macOS-Intel
            os: macos-latest
            target: x86_64-apple-darwin
            bundles: app,dmg
          - name: Windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
          - name: Linux-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb,rpm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf file
      - name: Toolchain (from rust-toolchain.toml) and target
        shell: bash
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add ${{ matrix.target }}
      - uses: actions/download-artifact@v4
        with:
          name: bundled-plugins
          path: crates/app/resources/plugins
      - run: npm ci
      - name: Set the version from the tag
        shell: bash
        run: |
          V="${TAG#v}"
          node -e '
            const fs = require("fs"), v = process.argv[1], f = "crates/app/tauri.conf.json";
            const c = JSON.parse(fs.readFileSync(f, "utf8")); c.version = v;
            fs.writeFileSync(f, JSON.stringify(c, null, 2) + "\n");' "$V"
      - name: Build
        shell: bash
        run: npx tauri build --config crates/app/tauri.conf.json --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} -- --locked
      - name: Package one-click zip
        shell: bash
        run: |
          set -euo pipefail
          V="${TAG#v}"
          B="target/${{ matrix.target }}/release/bundle"
          mkdir -p out
          ZIP="out/DuhcordCompanion-${{ matrix.name }}-$V.zip"
          case "${{ runner.os }}" in
            macOS)
              ditto -c -k --keepParent "$B/macos/Duhcord Companion.app" "$ZIP"
              cp "$B"/dmg/*.dmg "out/DuhcordCompanion-${{ matrix.name }}-$V.dmg"
              ;;
            Windows)
              SETUP=$(ls "$B"/nsis/*-setup.exe)
              cp "$SETUP" "out/DuhcordCompanion-Setup-$V.exe"
              cp "$B"/msi/*.msi "out/DuhcordCompanion-$V.msi"
              (cd out && 7z a -tzip "$(basename "$ZIP")" "DuhcordCompanion-Setup-$V.exe")
              ;;
            Linux)
              cp "$B"/appimage/*.AppImage "out/DuhcordCompanion-$V-x86_64.AppImage"
              chmod +x "out/DuhcordCompanion-$V-x86_64.AppImage"
              cp "$B"/deb/*.deb "out/"
              cp "$B"/rpm/*.rpm "out/"
              (cd out && zip -9 "$(basename "$ZIP")" "DuhcordCompanion-$V-x86_64.AppImage")
              ;;
          esac
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          path: out

  publish:
    name: Draft GitHub release
    needs: [plugins, app]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: out
          merge-multiple: true
      - name: Checksums
        run: cd out && sha256sum * | tee SHA256SUMS.txt
      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/* --clobber
          else
            gh release create "$TAG" out/* --draft --title "Duhcord Companion ${TAG#v}" --notes-file .github/release-notes.md
          fi
