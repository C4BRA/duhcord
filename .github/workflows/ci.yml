name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux system libraries (keyring, Tauri)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked
      - name: Interop (Swift vectors from Duhcord's CI)
        run: cargo run -q --locked -p duhcord-interop -- check interop/swift-vectors.json

  plugins:
    name: Plugins
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Linux system libraries (bridge test server)
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
        env:
          CI: "1"
      - name: UI script parses
        run: node --check ui/app.js
      - uses: actions/upload-artifact@v4
        with:
          name: plugins
          path: plugins/dist

  vencord:
    name: Vencord userplugin compiles
    needs: plugins
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: plugins
          path: dist
      - name: Build Vencord with the userplugin
        run: |
          git clone --depth 1 https://github.com/Vendicated/Vencord
          cp -r dist/vencord/duhcordPrivate Vencord/src/userplugins/
          cd Vencord
          corepack enable
          pnpm install --frozen-lockfile
          pnpm build
          pnpm exec tsc --noEmit -p . 2>&1 | tee tsc.log || true
          if grep -n "userplugins/duhcordPrivate" tsc.log; then
            echo "::error::TypeScript errors in the Duhcord Private userplugin"
            exit 1
          fi
