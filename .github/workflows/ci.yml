name: CI

on:
  push:
  pull_request:

# CI only reads the repository.
permissions:
  contents: read

jobs:
  signing-context:
    runs-on: ubuntu-latest
    outputs:
      release_build: ${{ steps.signing.outputs.release_build }}
      has_signing_cert: ${{ steps.signing.outputs.has_signing_cert }}
    steps:
      - id: signing
        env:
          RELEASE_BUILD: ${{ github.event_name == 'push' && (github.ref_name == github.event.repository.default_branch || startsWith(github.ref, 'refs/tags/v')) }}
          HAS_SIGNING_CERT: ${{ secrets.DUHCORD_SIGNING_P12 != '' }}
        run: |
          echo "release_build=$RELEASE_BUILD" >> "$GITHUB_OUTPUT"
          echo "has_signing_cert=$HAS_SIGNING_CERT" >> "$GITHUB_OUTPUT"

  build:
    runs-on: macos-15
    needs: signing-context
    outputs:
      sha256: ${{ steps.package.outputs.sha256 }}
    steps:
      # Actions are pinned to exact commits: a moved tag can't change what runs next to the signing secrets.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # CI never pushes, so don't leave a GitHub token in the checkout.
          persist-credentials: false
      # libdave and its dependencies for the voice helper, rebuilt only when the pinned versions change.
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: Vendor/libdave
          key: libdave-${{ runner.os }}-${{ hashFiles('scripts/build-libdave.sh', 'Sources/CDave/include/dave.h') }}
      - name: Build libdave
        run: scripts/build-libdave.sh
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Bundle app
        # Zipped with ditto so the executable bit and signature survive the artifact upload.
        run: |
          scripts/bundle.sh
          scripts/verify-bundle.sh build/Duhcord.app
          ditto -c -k --keepParent build/Duhcord.app build/Duhcord.zip
      - name: Prepare artifact
        id: package
        env:
          RELEASE_BUILD: ${{ needs.signing-context.outputs.release_build }}
          HAS_SIGNING_CERT: ${{ needs.signing-context.outputs.has_signing_cert }}
        run: |
          if [[ "$RELEASE_BUILD" == 'true' && "$HAS_SIGNING_CERT" == 'true' ]]; then
            mv build/Duhcord.zip build/Duhcord-unsigned.zip
            archive=build/Duhcord-unsigned.zip
          else
            archive=build/Duhcord.zip
          fi
          echo "sha256=$(shasum -a 256 "$archive" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: needs.signing-context.outputs.release_build == 'true' && needs.signing-context.outputs.has_signing_cert == 'true'
        with:
          name: Duhcord-unsigned
          path: build/Duhcord-unsigned.zip
          archive: false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: needs.signing-context.outputs.release_build != 'true' || needs.signing-context.outputs.has_signing_cert != 'true'
        with:
          name: Duhcord
          path: build/Duhcord.zip
          archive: false

  sign:
    runs-on: macos-15
    needs: [signing-context, build]
    if: needs.signing-context.outputs.release_build == 'true' && needs.signing-context.outputs.has_signing_cert == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # An upload with `archive: false` is named after the file, not the `name:` input.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Duhcord-unsigned.zip
          path: build
      - name: Check unsigned app hash
        run: echo "${{ needs.build.outputs.sha256 }}  build/Duhcord-unsigned.zip" | shasum -a 256 -c -
      - name: Unpack unsigned app
        run: ditto -x -k build/Duhcord-unsigned.zip build/
      - name: Import signing certificate
        env:
          DUHCORD_SIGNING_P12: ${{ secrets.DUHCORD_SIGNING_P12 }}
          DUHCORD_SIGNING_PASSWORD: ${{ secrets.DUHCORD_SIGNING_PASSWORD }}
        run: scripts/ci-import-certificate.sh
      - name: Sign and verify app
        run: |
          scripts/sign-bundle.sh build/Duhcord.app
          DUHCORD_REQUIRE_RELEASE_SIGNATURE=1 scripts/verify-bundle.sh build/Duhcord.app
          ditto -c -k --keepParent build/Duhcord.app build/Duhcord.zip
      - name: Remove signing keychain
        if: always() && env.DUHCORD_SIGN_KEYCHAIN != ''
        run: security delete-keychain "$DUHCORD_SIGN_KEYCHAIN"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Duhcord
          path: build/Duhcord.zip
          archive: false
